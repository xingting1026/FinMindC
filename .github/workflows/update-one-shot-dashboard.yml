name: Update one-shot dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "37 13 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: one-shot-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Choose FinMind end date
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime, timedelta, timezone

          taipei = timezone(timedelta(hours=8))
          now = datetime.now(taipei)
          end_date = now.date() if now.hour >= 21 else (now.date() - timedelta(days=1))
          print(f"FINMIND_END_DATE={end_date.isoformat()}")
          PY

      - name: Update market OHLCV matrices
        env:
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
        run: python scripts/update_market_ohlcv_matrices.py --end-date "$FINMIND_END_DATE"

      - name: Update high-win buy branch aggregates
        env:
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
        run: python scripts/update_branch_agg_direct.py --start-date 2026-01-01 --end-date "$FINMIND_END_DATE" --branch-list-csv data/one_shot_full_market/branch_direction_summary.csv --max-workers 4 --batch-size 20

      - name: Build dashboard data
        run: python scripts/build_one_shot_full_market_dashboard.py --branch-start-date 2026-01-01 --branch-end-date "$FINMIND_END_DATE" --data-output-dir data/one_shot_full_market --output-dir dashboard/one_shot

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Close.parquet High.parquet Low.parquet Open.parquet Volume.parquet
          git add data/branches data/one_shot_full_market dashboard/one_shot
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update one-shot dashboard data"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/one_shot

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
